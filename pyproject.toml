[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-task-generator"
version = "0.1.0"
description = "Ledger-first generator for LAB-style legal agent tasks (preliminary skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["claude-agent-sdk>=0.2"]  # only for backend.kind = "claude_sdk"

[project.scripts]
ltg = "ltg.cli:main"

[tool.setuptools.packages.find]
include = ["ltg*"]

[tool.setuptools.package-data]
ltg = ["data/precedents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
