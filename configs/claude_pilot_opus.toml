# Claude pilot with Opus generating and Haiku solving, through the Claude Agent SDK on the logged-in
# Claude Code subscription (no API key, no direct API calls).
#   .venv/bin/python -m ltg run --config configs/claude_pilot_opus.toml
# The solver runs on a different, weaker model than the generator, so the difficulty check means something:
# when Sonnet solved Sonnet's tasks it found every planted issue every time.
# Opus uses subscription limits several times faster than Sonnet; if a round stops at the limit, rerun with --resume.

[run]
n_matters = 3
seed = 1
out_dir = "runs/claude_pilot3_opus"
concurrency = 2

[backend]
kind = "claude_sdk"
default_model = "opus"              # ledger, drafting, rubric, answers, gate checks and the judge

[backend.models]
# Haiku solves from round 5 on (Syrena, 2026-10-18). With Sonnet solving, rounds 2 to 4 rejected 3 of 6 sound
# tasks as too easy: Sonnet found every planted issue. The lab trains open models far weaker than Sonnet, so
# Haiku is the closer difficulty reference. Opus still writes, checks and judges.
solver = "haiku"

# Folders of 4 to 5 documents: a 3-document folder lets the solver read everything (known weakness 3). The
# evidence so far is mixed: accepted tasks had 4 and 5 documents, too-easy ones 4 and 5 as well.
[spec]
n_documents = [4, 5]

[gates]
solver_attempts = 3
solver_max_steps = 28               # room to page through 5 longer documents (a 12,700-word folder took 17 steps)
