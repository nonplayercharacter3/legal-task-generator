# vLLM OpenAI-compatible server for Qwen3-32B (FP8) on one 80 GB A100, namespace ecepxie.
#
# A bare Pod on purpose. NRP policy (nrp.ai/documentation/userdocs/start/policies, read 2026-10-18):
# Deployments may not request GPUs, Jobs may not run commands that never end (a server), and a pod without a
# controller counts as interactive: at most 2 GPUs, 32 GB RAM and 16 CPU cores, destroyed after 6 hours.
# So this pod is for a working session only. Delete it as soon as the run ends; an idle pod holds the GPU.
#
#   kubectl apply -n ecepxie -f deploy/nautilus/pvc.yaml               # once
#   kubectl apply -n ecepxie -f deploy/nautilus/vllm-qwen3-32b.yaml
#   kubectl logs -n ecepxie -f ltg-vllm-qwen3-32b                  # ready at "Application startup complete"
#   kubectl port-forward -n ecepxie pod/ltg-vllm-qwen3-32b 8000:8000
#   kubectl delete pod -n ecepxie ltg-vllm-qwen3-32b               # when done
apiVersion: v1
kind: Pod
metadata:
  name: ltg-vllm-qwen3-32b
  labels:
    app: ltg-vllm-qwen3-32b
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 21600          # 6 hours, the interactive pod limit; ends a forgotten pod
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product   # nvidia.com/a100 also covers 40 GB cards
                operator: In
                values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-80GB-PCIe]
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.30.0     # CUDA 13, needs driver 580+; every NRP GPU node had 580+ on 2026-10-18
      args:
        - Qwen/Qwen3-32B-FP8                # ~33 GB of weights; A100 runs FP8 as weight-only (Marlin)
        - --served-model-name=Qwen/Qwen3-32B
        - --max-model-len=40960             # the model's native window; longer needs YaRN
        - --gpu-memory-utilization=0.90
        - --reasoning-parser=qwen3          # thinking goes to reasoning_content, not content
        - --port=8000
      env:
        - name: HF_HOME
          value: /cache/huggingface
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet: {path: /health, port: 8000}
        periodSeconds: 15
      resources:
        requests: {nvidia.com/a100: 1, cpu: "8", memory: 32Gi}
        limits: {nvidia.com/a100: 1, cpu: "8", memory: 32Gi}
      volumeMounts:
        - {name: ltg-hf-cache, mountPath: /cache}
  volumes:
    - name: ltg-hf-cache
      persistentVolumeClaim:
        claimName: ltg-hf-cache
